<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Toolbox icon -->
  <g transform="translate(256,210)">
    <!-- Box -->
    <rect x="-120" y="-80" width="240" height="160" rx="16" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <!-- Handle -->
    <path d="M-50,-80 Q-50,-130 0,-130 Q50,-130 50,-80" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <!-- Divider line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#accent)" stroke-width="3"/>
    <!-- Math symbols -->
    <text x="-80" y="60" font-family="sans-serif" font-size="36" fill="url(#accent)" text-anchor="middle">+</text>
    <text x="0" y="60" font-family="sans-serif" font-size="36" fill="url(#accent)" text-anchor="middle">×</text>
    <text x="80" y="60" font-family="sans-serif" font-size="36" fill="url(#accent)" text-anchor="middle">÷</text>
    <!-- π symbol top -->
    <text x="0" y="-10" font-family="serif" font-size="28" fill="url(#accent)" text-anchor="middle" font-weight="bold">π</text>
  </g>
  <!-- Title -->
  <text x="256" y="400" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">Basic 工具箱</text>
</svg>